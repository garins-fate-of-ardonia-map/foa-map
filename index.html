<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>World Map</title>

  <!-- Leaflet CSS: loaded from CDN, no download needed -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1008;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    /* The map fills the whole window */
    #map {
      width: 100vw;
      height: 100vh;
    }

    /* ── Timeline bar at the bottom ── */
    #timeline {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(15, 10, 4, 0.88);
      border: 1px solid #6b4f2a;
      border-radius: 10px;
      padding: 10px 24px;
      color: #d4b483;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      /* Hidden until timeline.json has more than 1 era — see JS below */
    }

    #era-label {
      font-size: 1em;
      min-width: 180px;
      text-align: center;
      letter-spacing: 0.03em;
    }

    #era-slider {
      width: 220px;
      accent-color: #a07840;
      cursor: pointer;
    }

    .timeline-arrow {
      cursor: pointer;
      font-size: 1em;
      user-select: none;
      opacity: 0.7;
      transition: opacity 0.15s;
    }
    .timeline-arrow:hover { opacity: 1; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="timeline">
    <span class="timeline-arrow" id="btn-prev">◀</span>
    <input type="range" id="era-slider" min="0" step="1" value="0"/>
    <span class="timeline-arrow" id="btn-next">▶</span>
    <div id="era-label"></div>
  </div>

  <!-- Leaflet JS: loaded from CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    fetch('timeline.json')
      .then(r => r.json())
      .then(eras => initMap(eras));

    function initMap(eras) {

      // ── Map setup ────────────────────────────────────────────
      const map = L.map('map', {
        crs: L.CRS.Simple,  // flat projection, no globe math
        minZoom: 0,  // allows zooming out beyond zoom 0
        maxZoom: 4,         // match the number of zoom levels you've drawn
        zoomSnap: 0.5,
        attributionControl: false
      });

      // ── IMPORTANT: set these to match your full map image size in pixels ──
      // At zoom level 0 you have 1 tile (1024x1024).
      // At zoom level 1 you have 2x2 tiles (2048x2048). Etc.
      // So if your highest zoom level is 4, your full image is 1024 * 2^4 = 16384x16384.
      // Adjust mapWidth and mapHeight to your actual dimensions.
      const mapWidth  = 16384; // pixels at max zoom
      const mapHeight = 16384; // pixels at max zoom

      // Convert pixel dimensions to Leaflet's Simple CRS coordinate space
      const bounds = map.unproject([mapWidth, mapHeight], map.getMaxZoom());
      map.setMaxBounds([[0, 0], [bounds.lat, bounds.lng]]);
      map.fitBounds([[0, 0], [bounds.lat, bounds.lng]]);
      map.setView([bounds.lat / 2, bounds.lng / 2], 0);

      // ── Tile layer ───────────────────────────────────────────
      // Starts on the last (most recent) era
      let currentIndex = eras.length - 1;
      let tileLayer = makeTileLayer(eras[currentIndex].basePath);
      tileLayer.addTo(map);

      // ── Timeline UI ──────────────────────────────────────────
      const slider   = document.getElementById('era-slider');
      const label    = document.getElementById('era-label');
      const timeline = document.getElementById('timeline');
      const btnPrev  = document.getElementById('btn-prev');
      const btnNext  = document.getElementById('btn-next');

      slider.max   = eras.length - 1;
      slider.value = currentIndex;
      label.textContent = eras[currentIndex].label;

      // Hide the timeline bar entirely if there's only one era (no history yet)
      if (eras.length <= 1) {
        timeline.style.display = 'none';
      }

      function switchEra(index) {
        if (index < 0 || index > eras.length - 1) return;
        currentIndex  = index;
        slider.value  = index;
        label.textContent = eras[index].label;

        const newLayer = makeTileLayer(eras[index].basePath);
        newLayer.addTo(map);
        // Wait for new tiles to start loading before removing the old layer
        // This prevents a flicker/blank-map flash during the swap
        newLayer.once('loading', () => {
          setTimeout(() => map.removeLayer(tileLayer), 300);
        });
        tileLayer = newLayer;
      }

      slider.addEventListener('input', () => switchEra(parseInt(slider.value)));
      btnPrev.addEventListener('click', () => switchEra(currentIndex - 1));
      btnNext.addEventListener('click', () => switchEra(currentIndex + 1));
    }

    // ── Tile layer factory ───────────────────────────────────────
    function makeTileLayer(basePath) {
      return L.tileLayer(basePath + '{z}/{x}/{y}.png', {
        tileSize: 1024,
        noWrap: true,
        // If a tile file is missing (e.g. a sparse snapshot),
        // show a transparent tile instead of a broken image icon.
        // You'll need to add a real empty.png to your repo root.
        errorTileUrl: 'empty.png',
        updateWhenIdle: false // helpful during development
      });
    }
  </script>

</body>
</html>
